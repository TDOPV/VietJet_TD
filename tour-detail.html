<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi Tiết Tour Du Lịch - Vietjet Travel</title>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/header-footer.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">
  <!-- sql.js WebAssembly -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="container navbar">
      <a href="index.html" class="brand-logo">
        <img src="Images/vietjet-air.png" alt="Vietjet Logo">
        <span class="brand-text">Vietjet<span>.com</span></span>
      </a>

      <nav class="nav-menu">
        <a href="index.html" class="nav-link">Trang Chủ</a>
        <a href="flights.html" class="nav-link">Chuyến Bay</a>
        <a href="tour.html" class="nav-link active">Tour Du Lịch</a>
      </nav>

      <div class="nav-actions">
        <div class="hotline-pill">
          <i class="fas fa-phone-alt"></i>
          <span>1900 1886</span>
        </div>
        <a href="cart.html" class="cart-btn-link" title="Xem Giỏ Hàng">
          <i class="fas fa-shopping-cart"></i>
          <span class="cart-badge">0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="container py-5" style="padding-top: 40px; padding-bottom: 80px;">
    <!-- Nút quay lại -->
    <div class="mb-4">
      <a href="tour.html" class="btn btn-outline-gray btn-sm">
        <i class="fas fa-arrow-left"></i> Quay lại danh sách tour
      </a>
    </div>

    <!-- KHUNG THÔNG TIN TOUR -->
    <div id="tourDetailContainer">
      <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="text-muted mt-2">Đang tải lịch trình tour...</p>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="container footer-bottom">
      <p>&copy; 2026 Vietjet Travel & Booking. Mọi quyền được bảo lưu.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/db.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const tourId = urlParams.get('id') || 1;

      const tour = await window.dbApp.getTourById(tourId);
      const container = document.getElementById('tourDetailContainer');

      if (!tour) {
        container.innerHTML = `
          <div class="card p-5 text-center">
            <h3>Không tìm thấy thông tin tour!</h3>
            <a href="tour.html" class="btn btn-primary mt-3">Quay lại</a>
          </div>
        `;
        return;
      }

      let itinerary = [];
      try {
        itinerary = typeof tour.itinerary_json === 'string' ? JSON.parse(tour.itinerary_json) : tour.itinerary_json;
      } catch (e) {
        itinerary = [];
      }

      container.innerHTML = `
        <div style="display: grid; grid-template-columns: 1fr 380px; gap: var(--spacing-xl); align-items: start;">
          
          <!-- CỘT TRÁI: THÔNG TIN TOUR & LỊCH TRÌNH -->
          <div>
            <div class="card" style="margin-bottom: var(--spacing-xl);">
              <div style="position: relative; width: 100%; aspect-ratio: 3 / 2; overflow: hidden; border-radius: var(--radius-lg) var(--radius-lg) 0 0;">
                <img src="${tour.thumbnail_url}" alt="${tour.title}" style="width: 100%; height: 100%; object-fit: cover;">
                <span class="badge badge-primary" style="position: absolute; top: 16px; left: 16px; font-size: 14px; padding: 6px 14px;">
                  <i class="fas fa-plane"></i> Hãng bay: ${tour.airline_name}
                </span>
                <span class="badge badge-dark" style="position: absolute; top: 16px; right: 16px; font-size: 14px; padding: 6px 14px;">
                  ${tour.duration_days} Ngày ${tour.duration_nights} Đêm
                </span>
              </div>

              <div style="padding: var(--spacing-xl);">
                <h1 style="font-size: 26px; margin-bottom: 12px;">${tour.title}</h1>
                <div class="d-flex gap-lg text-muted" style="font-size: 14px; margin-bottom: 20px; flex-wrap: wrap;">
                  <div><i class="fas fa-map-marker-alt text-primary"></i> <strong>Hành trình:</strong> ${tour.departure_city} ➔ ${tour.destination_city}</div>
                  <div><i class="fas fa-clock text-primary"></i> <strong>Thời gian bay:</strong> ${tour.flight_time}</div>
                  <div><i class="fas fa-plane text-primary"></i> <strong>Máy bay:</strong> ${tour.aircraft_type} (Airbus/Boeing)</div>
                </div>

                <div style="background: #f8fafc; padding: 16px; border-radius: var(--radius-md); border-left: 4px solid var(--primary-color);">
                  <strong style="color: var(--primary-color);">Dịch vụ trọn gói đi kèm:</strong>
                  <p class="text-muted mt-1" style="font-size: 14px;">${tour.services}</p>
                </div>
              </div>
            </div>

            <!-- LỊCH TRÌNH CHUYẾN ĐI CHI TIẾT -->
            <div class="card" style="padding: var(--spacing-xl);">
              <h2 style="font-size: 20px; margin-bottom: 8px;">
                <i class="fas fa-calendar-alt text-primary"></i> Lịch Trình Chuyến Đi Chi Tiết
              </h2>
              <p class="text-muted" style="font-size: 13px; margin-bottom: 24px;">Lịch trình được thiết kế tối ưu, cân bằng giữa tham quan trải nghiệm và nghỉ dưỡng thư thái.</p>

              <div class="tour-itinerary-timeline">
                ${itinerary.map((item, idx) => `
                  <div class="timeline-item">
                    <div class="timeline-dot">${item.day || (idx + 1)}</div>
                    <div class="timeline-content">
                      <div class="timeline-title">Ngày ${item.day || (idx + 1)}: ${item.title}</div>
                      <div class="timeline-desc">${item.detail}</div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>

          <!-- CỘT PHẢI: KHUNG ĐẶT TOUR (STICKY) -->
          <div class="card" style="padding: var(--spacing-xl); position: sticky; top: calc(var(--header-height) + 20px);">
            <div style="font-size: 12px; color: var(--text-light); text-transform: uppercase;">Giá tour trọn gói / khách</div>
            <div style="font-size: 32px; font-weight: 800; color: var(--primary-color); margin-bottom: 16px;">
              ${formatVND(tour.price)}
            </div>

            <div class="form-group">
              <label class="form-label"><i class="far fa-calendar-alt text-primary"></i> Ngày khởi hành mong muốn</label>
              <input type="date" class="form-control" value="2026-11-25" id="tourBookingDate">
            </div>

            <div class="form-group">
              <label class="form-label"><i class="fas fa-user-friends text-primary"></i> Số lượng khách (Vé)</label>
              <select class="form-control" id="tourQuantity">
                <option value="1">1 Hành khách</option>
                <option value="2" selected>2 Hành khách</option>
                <option value="3">3 Hành khách</option>
                <option value="4">4 Hành khách</option>
                <option value="5">5 Hành khách</option>
              </select>
            </div>

            <ul style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.8;">
              <li><i class="fas fa-check text-success"></i> Vé máy bay khứ hồi Vietjet</li>
              <li><i class="fas fa-check text-success"></i> Khách sạn 4-5 sao sang trọng</li>
              <li><i class="fas fa-check text-success"></i> Hướng dẫn viên suốt tuyến</li>
              <li><i class="fas fa-check text-success"></i> Bảo hiểm du lịch 100.000.000 ₫</li>
            </ul>

            <button class="btn btn-primary btn-block btn-lg" id="btnAddToCartTour">
              <i class="fas fa-cart-plus"></i> Chọn Tour & Đặt Ngay
            </button>
          </div>

        </div>
      `;

      // Xử lý nút Thêm vào giỏ hàng
      document.getElementById('btnAddToCartTour').addEventListener('click', () => {
        const qty = parseInt(document.getElementById('tourQuantity').value) || 1;
        const departDate = document.getElementById('tourBookingDate').value;

        window.cartApp.addItem({
          item_type: 'tour',
          reference_id: tour.id,
          title: tour.title,
          price: tour.price,
          quantity: qty,
          airline: tour.airline_name,
          duration: `${tour.duration_days}N${tour.duration_nights}Đ`,
          depart_date: departDate
        });

        setTimeout(() => window.location.href = 'cart.html', 400);
      });
    });
  </script>
</body>
</html>
